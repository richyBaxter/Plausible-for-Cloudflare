name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Wrangler runs entirely in --local mode here (Miniflare + a local D1), so no
# Cloudflare account or secrets are required to run these checks.
env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle (dry-run deploy)
        run: npx wrangler deploy --dry-run

      - name: End-to-end smoke test
        run: npm test
